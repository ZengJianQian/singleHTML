<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绩效管理系统 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 0 10px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .icon-blue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .icon-green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .icon-orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .icon-purple {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }

        .icon-red {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #fff;
        }

        .icon-teal {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>绩效管理系统</h1>
            <p>请选择您需要使用的功能模块</p>
        </div>

        <div class="grid">
            <a href="index2.html" class="card">
                <div class="card-icon icon-blue">📋</div>
                <div class="card-title">月度工作考核表</div>
                <div class="card-desc">查看和填写月度工作考核表，包含工作任务、考核标准和评分</div>
            </a>

            <a href="绩效填写.html" class="card">
                <div class="card-icon icon-green">✍️</div>
                <div class="card-title">绩效填写</div>
                <div class="card-desc">在线填写绩效考核内容，支持各项指标的自评和打分</div>
            </a>

            <a href="绩效填写签名版.html" class="card">
                <div class="card-icon icon-orange">✒️</div>
                <div class="card-title">绩效填写（签名版）</div>
                <div class="card-desc">带电子签名功能的绩效填写页面，支持手写签名确认</div>
            </a>

            <a href="绩效打印.html" class="card">
                <div class="card-icon icon-purple">🖨️</div>
                <div class="card-title">绩效打印</div>
                <div class="card-desc">打印绩效考核表，支持预览和打印设置</div>
            </a>

            <a href="转文本.html" class="card">
                <div class="card-icon icon-red">📄</div>
                <div class="card-title">转文本</div>
                <div class="card-desc">将绩效数据转换为文本格式，便于导出和分享</div>
            </a>

            <a href="测试页面.html" class="card">
                <div class="card-icon icon-teal">🧪</div>
                <div class="card-title">档案同步测试</div>
                <div class="card-desc">档案同步功能测试页面，用于开发和调试</div>
            </a>
        </div>

        <div class="footer">
            <p>绩效管理系统 &copy; 2026</p>
        </div>
    </div>
</body>

</html>
